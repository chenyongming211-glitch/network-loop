[package]
name = "l2-loop-ebpf"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "l2-loop-ebpf"
path = "src/main.rs"

[features]
diagnostics = []
fingerprint-stages = ["diagnostics"]

[[bin]]
name = "l2-loop-diag-fp-hash"
path = "src/bin/fp_hash.rs"
required-features = ["fingerprint-stages"]

[[bin]]
name = "l2-loop-diag-fp-metadata"
path = "src/bin/fp_metadata.rs"
required-features = ["fingerprint-stages"]

[[bin]]
name = "l2-loop-diag-fp-clock"
path = "src/bin/fp_clock.rs"
required-features = ["fingerprint-stages"]

[[bin]]
name = "l2-loop-diag-fp-map"
path = "src/bin/fp_map.rs"
required-features = ["fingerprint-stages"]

[[bin]]
name = "l2-loop-diag-hooks-only"
path = "src/bin/hooks_only.rs"
required-features = ["diagnostics"]

[[bin]]
name = "l2-loop-diag-config-lookup"
path = "src/bin/config_lookup.rs"
required-features = ["diagnostics"]

[[bin]]
name = "l2-loop-diag-counters"
path = "src/bin/counters.rs"
required-features = ["diagnostics"]

[[bin]]
name = "l2-loop-diag-fingerprints"
path = "src/bin/fingerprints.rs"
required-features = ["diagnostics"]

[dependencies]
aya-ebpf.workspace = true
aya-log-ebpf.workspace = true
l2-loop-common = { path = "../../crates/l2-loop-common" }

