name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  script-tests:
    name: Script safety
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Test isolated host harness safety
        shell: pwsh
        run: pwsh -NoProfile -File scripts/tests/verify-isolated-host.Tests.ps1

      - name: Test build supply-chain policy
        shell: pwsh
        run: pwsh -NoProfile -File scripts/tests/verify-build-supply-chain.Tests.ps1

      - name: Test deployment gate harness safety
        shell: pwsh
        run: pwsh -NoProfile -File scripts/tests/verify-deployment-gates.Tests.ps1

      - name: Test generated-root installation harness safety
        shell: pwsh
        run: pwsh -NoProfile -File scripts/tests/verify-installation.Tests.ps1

  windows-script-tests:
    name: Windows PowerShell safety
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Test isolated host harness with Windows PowerShell
        shell: powershell
        run: powershell -NoProfile -File scripts/tests/verify-isolated-host.Tests.ps1

      - name: Test build supply-chain policy with Windows PowerShell
        shell: powershell
        run: powershell -NoProfile -File scripts/tests/verify-build-supply-chain.Tests.ps1

      - name: Test deployment gate harness with Windows PowerShell
        shell: powershell
        run: powershell -NoProfile -File scripts/tests/verify-deployment-gates.Tests.ps1

      - name: Test generated-root installation harness with Windows PowerShell
        shell: powershell
        run: powershell -NoProfile -File scripts/tests/verify-installation.Tests.ps1

  userspace:
    name: Userspace
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable at Delivery C gate
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt

      - name: Verify locked dependency graph
        run: cargo metadata --locked --no-deps

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Enforce RustSec advisory policy
        run: |
          cargo audit
          git -C "$CARGO_HOME/advisory-db" show -s --format='RustSec advisory database revision: %H' HEAD

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Check default workspace members
        run: cargo check --locked

      - name: Run privileged generated-root installation tests
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/l2-loop-install-tests
          RUSTUP_HOME: /home/runner/.rustup
        run: >-
          sudo env "PATH=$PATH" "CARGO_HOME=$CARGO_HOME"
          "RUSTUP_HOME=$RUSTUP_HOME" "CARGO_TARGET_DIR=$CARGO_TARGET_DIR"
          cargo test --locked --package l2-loop-agent
          --test installation_fs --test installation_faults

  ebpf:
    name: eBPF
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install stable Rust for xtask
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable at Delivery C gate
        with:
          toolchain: 1.97.1

      - name: Install nightly Rust for eBPF
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly at Delivery C gate
        with:
          toolchain: nightly-2026-08-10
          components: rust-src

      - name: Install bpf-linker
        run: cargo install bpf-linker --version 0.10.4 --locked

      - name: Build eBPF object
        run: cargo xtask build-ebpf

      - name: Upload eBPF object for bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: l2-loop-ebpf-object-${{ github.sha }}
          path: target/bpfel-unknown-none/release/l2-loop-ebpf
          if-no-files-found: error
          retention-days: 1

  bundle:
    name: Bundle
    needs:
      - userspace
      - ebpf
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install stable Rust with MUSL target
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable at Delivery C gate
        with:
          toolchain: 1.97.1
          targets: x86_64-unknown-linux-musl

      - name: Build MUSL userspace binaries
        env:
          L2_LOOP_BUILD_COMMIT_SHA: ${{ github.sha }}
        run: >-
          cargo build --locked --release --target x86_64-unknown-linux-musl
          --package l2-loop-agent --package l2-loop-cli

      - name: Download eBPF object
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: l2-loop-ebpf-object-${{ github.sha }}
          path: .artifacts/ebpf

      - name: Create release bundle
        run: >-
          cargo xtask bundle
          --commit-sha "${{ github.sha }}"
          --daemon target/x86_64-unknown-linux-musl/release/l2-loopd
          --cli target/x86_64-unknown-linux-musl/release/l2-loopctl
          --deploy-checker target/x86_64-unknown-linux-musl/release/l2-loop-deploycheck
          --installer target/x86_64-unknown-linux-musl/release/l2-loop-install
          --host-check target/x86_64-unknown-linux-musl/release/l2-loop-hostcheck
          --ebpf .artifacts/ebpf/l2-loop-ebpf
          --service-unit packaging/l2-loop.service
          --authorization-example packaging/deployment-v1.example.json
          --output .artifacts/bundle

      - name: Verify bundle checksums
        working-directory: .artifacts/bundle
        run: sha256sum --check SHA256SUMS

      - name: Verify bundle inventory
        working-directory: .artifacts/bundle
        run: |
          test "$(find . -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 10
          test "$(find . -mindepth 1 -maxdepth 1 ! -type f | wc -l)" -eq 0
          test "$(find . -mindepth 2 | wc -l)" -eq 0
          test "$(wc -l < SHA256SUMS)" -eq 9

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: l2-loop-linux-x86_64-${{ github.sha }}
          path: .artifacts/bundle/
          if-no-files-found: error
          retention-days: 14

      - name: Download exact release bundle for generated-root acceptance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: l2-loop-linux-x86_64-${{ github.sha }}
          path: ${{ runner.temp }}/l2-loop-install-artifact-${{ github.sha }}

      - name: Run generated-root installation acceptance
        env:
          CARGO_HOME: /home/runner/.cargo
          RUSTUP_HOME: /home/runner/.rustup
          CARGO_TARGET_DIR: ${{ runner.temp }}/l2-loop-install-acceptance-target
        run: >-
          sudo env "PATH=$PATH" "CARGO_HOME=$CARGO_HOME" "RUSTUP_HOME=$RUSTUP_HOME"
          "CARGO_TARGET_DIR=$CARGO_TARGET_DIR" pwsh -NoProfile
          -File scripts/verify-installation.ps1
          -Commit "${{ github.sha }}"
          -ArtifactDirectory "${{ runner.temp }}/l2-loop-install-artifact-${{ github.sha }}"
